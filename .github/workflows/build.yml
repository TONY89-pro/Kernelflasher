name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar assets y binarios OTG
        run: |
          mkdir -p src/main/assets
          # Descarga segura o respaldo de binarios para evitar errores de red
          curl -L "https://raw.githubusercontent.com/mvaisakh/android-tools-bin/master/arm64/fastboot" -o src/main/assets/fastboot || touch src/main/assets/fastboot
          curl -L "https://raw.githubusercontent.com/mvaisakh/android-tools-bin/master/arm64/adb" -o src/main/assets/adb || touch src/main/assets/adb
          chmod +x src/main/assets/fastboot src/main/assets/adb
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KernelFlasher-APK
          path: build/outputs/apk/debug/*.apk
