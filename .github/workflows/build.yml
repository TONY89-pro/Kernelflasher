name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Descargar binarios ADB/Fastboot ARM64 para OTG
        run: |
          mkdir -p src/main/assets
          curl -L "https://github.com/rendiix/termux-adb-fastboot/raw/master/binary/arm64/fastboot" -o src/main/assets/fastboot || true
          curl -L "https://github.com/rendiix/termux-adb-fastboot/raw/master/binary/arm64/adb" -o src/main/assets/adb || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KernelFlasher-APK
          path: build/outputs/apk/debug/*.apk
